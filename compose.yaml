services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canopy-local-development}
      POSTGRES_DB: canopy
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy -d canopy"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-canopylocal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-canopy-local-storage-password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
  bucket:
    image: quay.io/minio/mc:latest
    depends_on: [storage]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-canopylocal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-canopy-local-storage-password}
    entrypoint: ["/bin/sh", "-c"]
    command: ['until mc alias set local http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing local/canopy']
  api:
    build: .
    image: canopy-app:local
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://canopy:${POSTGRES_PASSWORD:-canopy-local-development}@db:5432/canopy
      S3_ENDPOINT_URL: http://storage:9000
      S3_BUCKET: canopy
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-canopylocal}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-canopy-local-storage-password}
      AWS_DEFAULT_REGION: us-east-1
      CANOPY_API_TOKEN: ${CANOPY_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db: {condition: service_healthy}
      bucket: {condition: service_completed_successfully}
  worker:
    build: .
    image: canopy-app:local
    command: ["python", "-m", "backend.worker"]
    environment: *app_environment
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
  objects:
